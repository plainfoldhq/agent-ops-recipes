name: watchdog
# Copy to .github/workflows/watchdog.yml and watchdog_checks.py to scripts/.
# Daily health check that needs no agent: opens ONE issue (GitHub notifies repo watchers by email)
# when the agent setup has stopped working, comments while it stays broken, closes it on recovery.
# Your agent prompt should also say: "If an open 'Agent watchdog alert' issue exists, fixing it is the first job."
on:
  schedule:
    - cron: "17 18 * * *"   # pick a time after your agent runs normally finish
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200          # enough history for the --stale check
      - name: Check health
        run: |
          python3 scripts/watchdog_checks.py \
            --stale STATE.md:30 \
            --json-field usage.json:weekly_pct \
            --command "tests=python3 -m unittest discover -s tests -q" \
            --out problems.md
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Agent watchdog alert
        run: |
          # exact title match (search alone is fuzzy and could pick up an unrelated issue)
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -s problems.md ]; then
            if [ -z "$num" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file problems.md
            else
              { echo "Still failing $(date -u +%F):"; cat problems.md; } > comment.md
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Checks pass again $(date -u +%F)."
          fi
